<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VVP Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1e3a8a; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                            url('image_3e0416%20%281%29.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="p-4 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
        <h1 class="text-4xl font-extrabold text-blue-900 text-center mb-8 tracking-tight">
            VVP Monitor
        </h1>
        
        <form id="vvpForm" class="space-y-4">
            <!-- NEW: Reporter Name Field -->
            <div>
                <label class="block text-sm font-bold text-gray-800 mb-1">Reporter Name / Amazina</label>
                <input type="text" id="reporter_name" class="w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-blue-500" placeholder="Izina ryawe" required>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-800 mb-1">Cell / Akagari</label>
                <select id="cell" class="w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-blue-500" required>
                    <option value="">Select Cell</option>
                    <option value="Gasizi">Gasizi</option>
                    <option value="Mudakama">Mudakama</option>
                    <option value="Murago">Murago</option>
                    <option value="Rubindi">Rubindi</option>
                    <option value="Rungu">Rungu</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-800 mb-1">Village / Umudugudu</label>
                <select id="village" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100/50 shadow-sm" disabled required>
                    <option value="">Select Village</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-800 mb-1">Indicator / Igipimo</label>
                <select id="indicator" class="w-full p-3 border border-gray-300 rounded-lg bg-gray-100/50 shadow-sm" disabled required>
                    <option value="">Select Indicator</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-1">Month / Ukwezi</label>
                    <select id="month" class="w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm" required>
                        <option value="">Month</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-800 mb-1">Value / Umubare</label>
                    <input type="number" id="val" step="any" class="w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm" placeholder="0.00" required>
                </div>
            </div>

            <button type="submit" id="btn" class="w-full bg-blue-700 hover:bg-blue-800 text-white text-lg font-black py-4 rounded-xl shadow-xl mt-6 uppercase tracking-widest transition-all active:scale-95">
                SUBMIT / OHEREZA
            </button>
        </form>
        <p id="msg" class="mt-4 text-center font-bold min-h-[24px]"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const URL = 'https://yrlxzjqcwrndiqokrgjq.supabase.co';
            const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlybHh6anFjd3JuZGlxb2tyZ2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDcwMDYsImV4cCI6MjA5NDEyMzAwNn0.7vj_znuKxNC3MBKMjkOnKxIqJ-tjOxEnH5NUM97eb1w';
            const client = supabase.createClient(URL, KEY);

            const vData = {
                "Gasizi": ["Kagano", "Kanzenze", "Kinyengagi", "Mikingo", "Rwanamiza"],
                "Mudakama": ["Kagongo", "Mikingo", "Gakuku", "Kararo", "Rubaka"],
                "Murago": ["Karurambi", "Manjari", "Rukingo", "Rusambu", "Rwinzovu"],
                "Rubindi": ["Butakanyundo", "Gacondo", "Gataraga", "Kabaya", "Kaberege"],
                "Rungu": ["Gahira", "Gatindori", "Kampande", "Nyarubande", "Gatovu"]
            };

            const mSel = document.getElementById('month');
            const cSel = document.getElementById('cell');
            const vSel = document.getElementById('village');
            const iSel = document.getElementById('indicator');
            const msg = document.getElementById('msg');
            const form = document.getElementById('vvpForm');
            const rName = document.getElementById('reporter_name'); // New Constant

            for(let i=1; i<=14; i++) {
                let o = document.createElement('option');
                o.value = i; o.textContent = "Ukwezi kwa " + i;
                mSel.appendChild(o);
            }

            cSel.onchange = function() {
                const villages = vData[this.value] || [];
                vSel.innerHTML = '<option value="">Select Village</option>';
                vSel.disabled = !villages.length;
                vSel.className = villages.length ? "w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm" : "w-full p-3 border border-gray-300 rounded-lg bg-gray-100/50 shadow-sm";
                
                villages.forEach(v => {
                    let o = document.createElement('option');
                    o.value = v; o.textContent = v;
                    vSel.appendChild(o);
                });
                iSel.innerHTML = '<option value="">Select Indicator</option>';
                iSel.disabled = true;
            };

            vSel.onchange = async function() {
                if(!this.value) return;
                iSel.innerHTML = '<option>Loading...</option>';
                iSel.disabled = true;
                
                const { data, error } = await client.from('app_dropdown_helper').select('*').eq('village', this.value);
                
                iSel.innerHTML = '<option value="">Select Indicator</option>';
                iSel.disabled = false;
                iSel.className = "w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm";
                
                if(data) {
                    data.forEach(row => {
                        let o = document.createElement('option');
                        o.value = row.indicator_id; 
                        o.textContent = row.project_type + ": " + row.indicator_name;
                        iSel.appendChild(o);
                    });
                }
            };

            form.onsubmit = async (e) => {
                e.preventDefault();
                const b = document.getElementById('btn');
                msg.innerText = "Biri koherezwa... (Syncing)";
                msg.style.color = "#1e40af";
                b.disabled = true;

                // UPDATED: Including reporter_name in the submission
                const { error } = await client.from('monthly_progress').upsert({
                    indicator_id: iSel.value,
                    month_number: parseInt(mSel.value),
                    recorded_value: parseFloat(document.getElementById('val').value),
                    reporter_name: rName.value // This sends the name to your new column
                });

                if(error) {
                    msg.innerText = "Habaye ikibazo: " + error.message;
                    msg.style.color = "#b91c1c";
                    b.disabled = false;
                } else {
                    msg.innerText = "Byageze ku ntego! (Success)";
                    msg.style.color = "#15803d";
                    form.reset();
                    b.disabled = false;
                    vSel.disabled = true;
                    iSel.disabled = true;
                }
            };
        });
    </script>
</body>
</html>
